<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Artist Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .contact-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            max-width: 1000px;
            margin: 60px auto;
            flex-wrap: wrap;
        }
        .contact-form {
            background: var(--white);
            padding: 50px 40px;
            border: 3px solid var(--charcoal);
            border-radius: var(--doodle-border);
            box-shadow: 12px 12px 0 var(--peach);
            flex: 1;
            min-width: 300px;
            position: relative;
        }
        .contact-form::before {
            content: '✉️';
            position: absolute;
            top: -20px;
            right: 20px;
            font-size: 40px;
            transform: rotate(15deg);
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-label {
            display: block;
            font-family: var(--font-heading);
            font-size: 20px;
            margin-bottom: 10px;
            color: var(--charcoal);
        }
        .form-input, .form-textarea {
            width: 100%;
            padding: 15px;
            font-family: var(--font-body);
            font-size: 16px;
            border: 2px dashed var(--charcoal);
            border-radius: 10px;
            background: rgba(244, 239, 234, 0.5);
            outline: none;
            transition: all 0.3s;
        }
        .form-input:focus, .form-textarea:focus {
            background: var(--white);
            border-style: solid;
            box-shadow: 4px 4px 0 var(--soft-lavender);
            transform: translateY(-2px);
        }
        .contact-illustration {
            flex: 1;
            max-width: 400px;
            text-align: center;
        }
        .contact-illustration img {
            width: 100%;
            border-radius: var(--doodle-border-alt);
            animation: float 5s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="notebook-bg"></div>
    
    <nav class="navbar">
        <div class="nav-brand">My Sketchbook</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="blog.html">Blog</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <header class="page-header" style="text-align: center; padding: 60px 20px 20px;">
        <h1 class="hero-title" style="transform: rotate(2deg);">Drop a Line!</h1>
        <p class="hero-subtitle">Let's sketch out some ideas together.</p>
    </header>

    <section class="contact-section">
        <div class="contact-illustration">
            <img src="assets/hero_artist_1773651212651.png" alt="Friendly cartoon character">
        </div>
        
        <form class="contact-form">
            <div class="form-group">
                <label class="form-label">Your Name</label>
                <input type="text" class="form-input" placeholder="Picasso?">
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-input" placeholder="hello@art.com">
            </div>
            <div class="form-group">
                <label class="form-label">Your Message</label>
                <textarea class="form-textarea" rows="5" placeholder="Scribble something nice here..."></textarea>
            </div>
            <button type="button" class="cta-btn" style="width: 100%;">Send Message ↗</button>
        </form>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-content">
            <h2 class="footer-brand">My Sketchbook</h2>
            <p>&copy; 2026 Crafted with ♥ and lots of pencils.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
